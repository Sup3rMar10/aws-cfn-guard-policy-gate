AWSTemplateFormatVersion: '2010-09-09'
Description: 'NON-COMPLIANT on purpose: s3-no-public-block'
Resources:
  B:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
      - Key: Owner
        Value: platform-team
      - Key: Environment
        Value: prod
