name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CFN_GUARD_VERSION: 3.2.1

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cfn-guard (pinned)
        run: |
          curl -sSL "https://github.com/aws-cloudformation/cloudformation-guard/releases/download/${CFN_GUARD_VERSION}/cfn-guard-v3-ubuntu-latest.tar.gz" | tar xz
          sudo install "cfn-guard-v3-ubuntu-latest/cfn-guard" /usr/local/bin/cfn-guard
          cfn-guard --version
      - name: Unit tests, one file per rule file
        run: bash unit.sh
      - name: Every rule against every fixture (27 templates, exact expected failures)
        run: bash matrix.sh

  templates:
    # The compliant templates are also valid CloudFormation, which is a different question from compliant.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install cfn-lint
      - run: cfn-lint templates/good/*.yaml

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
